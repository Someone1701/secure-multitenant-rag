<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Multi-Tenant RAG | Storage-Level Isolation & Grounding Gate</title>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            surface: {
              base: '#090d16',
              card: 'rgba(17, 24, 39, 0.75)',
              elevated: 'rgba(30, 41, 59, 0.7)',
              border: 'rgba(255, 255, 255, 0.08)'
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for runtime JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #090d16;
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 85%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
    }
    /* Custom sleek scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.5); }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Root mount point for React App -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- React Application Component Script (JSX) -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- Inline SVG Icons ---
    const ShieldIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
    );

    const UploadIcon = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
      </svg>
    );

    const TrashIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    );

    const SearchIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    );

    const CitationIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
      </svg>
    );

    const DocumentIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
    );

    // --- Main React App ---
    function App() {
      const [username, setUsername] = useState('alice');
      const [token, setToken] = useState(null);
      const [tenantId, setTenantId] = useState('tenant_alice');
      const [documents, setDocuments] = useState([]);
      const [isUploading, setIsUploading] = useState(false);
      const [uploadStatus, setUploadStatus] = useState(null);
      const [systemStatus, setSystemStatus] = useState(null);

      // Query & Gate state
      const [question, setQuestion] = useState('');
      const [threshold, setThreshold] = useState(0.65);
      const [isQuerying, setIsQuerying] = useState(false);
      const [queryResult, setQueryResult] = useState(null);
      const [toasts, setToasts] = useState([]);

      const fileInputRef = useRef(null);

      const addToast = (msg, type = 'info') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, msg, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      };

      // Authenticate as a tenant
      const authenticateTenant = async (user) => {
        try {
          const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user })
          });
          const data = await res.json();
          if (res.ok) {
            setUsername(user);
            setToken(data.access_token);
            setTenantId(data.tenant_id);
            setQueryResult(null);
            addToast(`Authenticated as ${user} (${data.tenant_id})`, 'success');
          } else {
            addToast(`Login failed: ${data.detail}`, 'error');
          }
        } catch (err) {
          addToast(`Auth network error: ${err.message}`, 'error');
        }
      };

      // Fetch documents for the active tenant
      const fetchDocuments = async () => {
        if (!token) return;
        try {
          const res = await fetch('/documents', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (res.ok) {
            setDocuments(data.documents || []);
          }
        } catch (err) {
          console.error("Failed to load documents", err);
        }
      };

      // Fetch system status
      const fetchSystemStatus = async () => {
        if (!token) return;
        try {
          const res = await fetch('/api/system-status', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setSystemStatus(data);
          }
        } catch (err) {
          console.error("Status fetch error", err);
        }
      };

      // Initial load & when token changes
      useEffect(() => {
        authenticateTenant('alice');
      }, []);

      useEffect(() => {
        if (token) {
          fetchDocuments();
          fetchSystemStatus();
        }
      }, [token, tenantId]);

      // Upload Document
      const handleFileUpload = async (file) => {
        if (!file || !token) return;
        setIsUploading(true);
        setUploadStatus({ type: 'loading', message: `Ingesting ${file.name} (layout parsing & S-BERT embeddings)...` });

        const formData = new FormData();
        formData.append('file', file);

        try {
          const res = await fetch('/documents/upload', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
          });
          const data = await res.json();
          if (res.ok) {
            addToast(`Ingested ${file.name} (${data.total_chunks} chunks)`, 'success');
            setUploadStatus({
              type: 'success',
              message: `Success: ${data.total_chunks} sliding chunks stored into ChromaDB isolated under ${tenantId}.`
            });
            fetchDocuments();
            fetchSystemStatus();
          } else {
            addToast(data.detail || 'Upload failed', 'error');
            setUploadStatus({ type: 'error', message: data.detail || 'Upload failed' });
          }
        } catch (err) {
          addToast(err.message, 'error');
          setUploadStatus({ type: 'error', message: err.message });
        } finally {
          setIsUploading(false);
          if (fileInputRef.current) fileInputRef.current.value = '';
          setTimeout(() => setUploadStatus(null), 6000);
        }
      };

      // Delete Document
      const handleDeleteDocument = async (docUuid, filename) => {
        if (!confirm(`Delete all vector chunks for "${filename}" under ${tenantId}?`)) return;
        try {
          const res = await fetch(`/documents/${docUuid}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (res.ok) {
            addToast(`Deleted ${data.deleted_chunks} chunks`, 'success');
            fetchDocuments();
            fetchSystemStatus();
          } else {
            addToast(data.detail || 'Delete failed', 'error');
          }
        } catch (err) {
          addToast(err.message, 'error');
        }
      };

      // Execute Grounded Query
      const handleQuery = async (queryText) => {
        const q = (queryText || question).trim();
        if (!q || !token) return;

        setIsQuerying(true);
        const startTime = performance.now();

        try {
          const res = await fetch('/query', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ question: q, threshold: parseFloat(threshold) })
          });
          const data = await res.json();
          const duration = ((performance.now() - startTime) / 1000).toFixed(2);

          if (res.ok) {
            setQueryResult({ ...data, duration });
          } else {
            addToast(data.detail || 'Query failed', 'error');
          }
        } catch (err) {
          addToast(err.message, 'error');
        } finally {
          setIsQuerying(false);
        }
      };

      return (
        <div className="flex-1 flex flex-col">
          {/* Header */}
          <header className="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-surface-border">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 py-3 flex items-center justify-between gap-4">
              
              {/* Brand */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white">
                  <ShieldIcon className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-base font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                    Secure Multi-Tenant RAG
                  </h1>
                  <p className="text-xs font-mono text-slate-400 flex items-center gap-2">
                    <span>Pre-Traversal HNSW Filter</span>
                    <span className="text-slate-600">&bull;</span>
                    <span className="text-indigo-400">&tau; = {Number(threshold).toFixed(2)} Grounding Gate</span>
                  </p>
                </div>
              </div>

              {/* Tenant Switcher */}
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 bg-slate-800/80 border border-slate-700/60 rounded-full px-3 py-1.5 shadow-inner">
                  <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse shadow-sm shadow-emerald-400/50"></div>
                  <span className="font-mono text-xs font-semibold text-indigo-300">{tenantId}</span>
                </div>

                <div className="flex bg-slate-800/60 p-1 rounded-lg border border-slate-700/50">
                  {['alice', 'bob', 'charles'].map((u) => (
                    <button
                      key={u}
                      onClick={() => authenticateTenant(u)}
                      className={`px-3 py-1 text-xs font-medium rounded-md transition-all capitalize ${
                        username === u 
                          ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/30' 
                          : 'text-slate-400 hover:text-white hover:bg-slate-700/50'
                      }`}
                    >
                      {u}
                    </button>
                  ))}
                </div>

                {systemStatus && (
                  <div className="hidden md:flex items-center gap-2 text-xs font-mono px-3 py-1.5 rounded-lg bg-slate-800/40 border border-slate-800 text-slate-400">
                    <span className="text-slate-500">Ollama:</span>
                    <span className={systemStatus.ollama_connected ? 'text-emerald-400 font-semibold' : 'text-amber-400'}>
                      {systemStatus.ollama_connected ? 'Online' : 'Offline'}
                    </span>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Main Grid Layout */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Left Column: Storage & Ingestion (4 cols) */}
            <div className="lg:col-span-4 flex flex-col gap-5">
              
              {/* Document Ingestion Card */}
              <div className="bg-slate-900/70 border border-surface-border rounded-2xl p-5 backdrop-blur-xl shadow-xl flex flex-col gap-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2 font-semibold text-sm text-slate-200">
                    <DocumentIcon className="w-5 h-5 text-indigo-400" />
                    <span>Tenant Documents</span>
                  </div>
                  <span className="text-xs font-mono px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                    {documents.length} files
                  </span>
                </div>

                {/* Upload Zone */}
                <div 
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  className="border-2 border-dashed border-indigo-500/30 hover:border-cyan-400/60 bg-indigo-500/5 hover:bg-cyan-500/5 rounded-xl p-6 text-center cursor-pointer transition-all group"
                >
                  <input 
                    type="file" 
                    ref={fileInputRef} 
                    className="hidden" 
                    accept=".pdf,.docx" 
                    onChange={(e) => e.target.files[0] && handleFileUpload(e.target.files[0])} 
                  />
                  <div className="w-12 h-12 mx-auto mb-3 rounded-xl bg-indigo-500/10 group-hover:bg-cyan-500/10 flex items-center justify-center text-indigo-400 group-hover:text-cyan-300 transition-colors">
                    <UploadIcon className="w-6 h-6" />
                  </div>
                  <p className="text-sm font-medium text-slate-200">
                    Click to upload <span className="text-indigo-400 font-semibold">PDF</span> or <span className="text-cyan-400 font-semibold">DOCX</span>
                  </p>
                  <p className="text-xs text-slate-500 mt-1">
                    Glyph-order parsing &bull; 512-token sliding window
                  </p>
                </div>

                {/* Upload Status Banner */}
                {uploadStatus && (
                  <div className={`p-3 rounded-lg text-xs font-mono border ${
                    uploadStatus.type === 'success' 
                      ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' 
                      : uploadStatus.type === 'error'
                      ? 'bg-rose-500/10 border-rose-500/30 text-rose-300'
                      : 'bg-indigo-500/10 border-indigo-500/30 text-indigo-300 animate-pulse'
                  }`}>
                    {uploadStatus.message}
                  </div>
                )}

                {/* Document List */}
                <div className="flex flex-col gap-2.5 max-h-[380px] overflow-y-auto pr-1">
                  {documents.length === 0 ? (
                    <div className="text-center py-8 text-xs text-slate-500 bg-slate-800/20 rounded-xl border border-dashed border-slate-800">
                      No documents stored under <span className="font-mono text-indigo-400">{tenantId}</span>.<br />Upload a document to begin.
                    </div>
                  ) : (
                    documents.map((doc) => (
                      <div 
                        key={doc.doc_uuid} 
                        className="bg-slate-800/40 hover:bg-slate-800/70 border border-slate-700/40 hover:border-indigo-500/30 rounded-xl p-3 flex items-center justify-between gap-3 transition-all"
                      >
                        <div className="min-w-0 flex-1">
                          <h4 className="text-xs font-semibold text-slate-200 truncate" title={doc.filename}>
                            {doc.filename}
                          </h4>
                          <div className="flex items-center gap-3 mt-1 text-[11px] font-mono text-slate-400">
                            <span className="text-indigo-300">{doc.chunk_count} chunks</span>
                            <span>&bull;</span>
                            <span>{doc.max_page} pages</span>
                            <span>&bull;</span>
                            <span className="text-slate-500">{doc.doc_uuid.substring(0, 8)}...</span>
                          </div>
                        </div>

                        <button 
                          onClick={() => handleDeleteDocument(doc.doc_uuid, doc.filename)}
                          className="p-1.5 text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition-colors"
                          title="Delete vectors"
                        >
                          <TrashIcon className="w-4 h-4" />
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>

              {/* Multi-Tenant Isolation Info Card */}
              <div className="bg-slate-900/40 border border-surface-border rounded-xl p-4 text-xs text-slate-400 flex flex-col gap-2">
                <span className="font-semibold text-slate-300 flex items-center gap-1.5">
                  <ShieldIcon className="w-4 h-4 text-emerald-400" />
                  Storage-Level Isolation Verified
                </span>
                <p className="leading-relaxed">
                  ChromaDB applies the tenant predicate <code className="text-indigo-300 font-mono">where={"{"}"tenant_id": "{tenantId}"{"}"}</code> during HNSW graph traversal prior to distance calculations.
                </p>
              </div>

            </div>

            {/* Right Column: Grounded QA & Relevance Gate Console (8 cols) */}
            <div className="lg:col-span-8 flex flex-col gap-5">
              
              {/* Query Card */}
              <div className="bg-slate-900/70 border border-surface-border rounded-2xl p-6 backdrop-blur-xl shadow-xl flex flex-col gap-4">
                
                {/* Search Bar */}
                <div className="flex gap-2">
                  <div className="relative flex-1">
                    <input 
                      type="text" 
                      value={question}
                      onChange={(e) => setQuestion(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleQuery()}
                      placeholder="Ask a question about your tenant's documents..." 
                      className="w-full bg-slate-950/60 border border-slate-700/60 focus:border-indigo-500 rounded-xl px-4 py-3.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition-all shadow-inner"
                    />
                  </div>
                  <button 
                    onClick={() => handleQuery()}
                    disabled={isQuerying || !question.trim()}
                    className="px-6 py-3.5 bg-gradient-to-r from-indigo-600 to-cyan-500 hover:from-indigo-500 hover:to-cyan-400 disabled:opacity-50 text-white rounded-xl font-medium text-sm flex items-center gap-2 shadow-lg shadow-indigo-500/25 transition-all whitespace-nowrap"
                  >
                    {isQuerying ? (
                      <>
                        <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                        <span>Grounding...</span>
                      </>
                    ) : (
                      <>
                        <SearchIcon className="w-4 h-4" />
                        <span>Search & Verify</span>
                      </>
                    )}
                  </button>
                </div>

                {/* Sample Prompt Chips */}
                <div className="flex flex-wrap items-center gap-2 text-xs">
                  <span className="text-slate-500 font-medium">Quick queries:</span>
                  {[
                    "What is the deterministic similarity gate threshold?",
                    "What are the sliding window chunk capacity and overlap?",
                    "What is the reported citation precision in the lab evaluation?",
                    "What is the current stock price of Apple in 2030?"
                  ].map((chip, idx) => (
                    <button
                      key={idx}
                      onClick={() => {
                        setQuestion(chip);
                        handleQuery(chip);
                      }}
                      className="px-2.5 py-1 rounded-lg bg-slate-800/60 hover:bg-indigo-500/15 border border-slate-700/50 hover:border-indigo-500/30 text-slate-300 hover:text-indigo-200 transition-colors"
                    >
                      {chip.length > 40 ? chip.substring(0, 38) + "..." : chip}
                    </button>
                  ))}
                </div>

                {/* Relevance Gate Meter & Threshold Controller */}
                <div className="bg-slate-950/50 border border-slate-800/80 rounded-xl p-4 flex flex-col gap-3">
                  <div className="flex items-center justify-between flex-wrap gap-2">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-semibold text-slate-300">Deterministic Relevance Gate</span>
                      {queryResult && (
                        <span className={`text-[11px] font-mono font-semibold px-2.5 py-0.5 rounded-full border ${
                          queryResult.gated 
                            ? 'bg-rose-500/15 border-rose-500/30 text-rose-300' 
                            : 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300'
                        }`}>
                          {queryResult.gated 
                            ? `REFUSED (s_max = ${queryResult.s_max.toFixed(3)} < ${queryResult.threshold.toFixed(2)})` 
                            : `GATE PASSED (s_max = ${queryResult.s_max.toFixed(3)} ≥ ${queryResult.threshold.toFixed(2)})`}
                        </span>
                      )}
                    </div>

                    {/* Interactive Threshold Slider */}
                    <div className="flex items-center gap-2">
                      <label className="text-xs font-mono text-slate-400">
                        &tau; threshold:
                      </label>
                      <input 
                        type="range" 
                        min="0.10" 
                        max="0.95" 
                        step="0.05"
                        value={threshold}
                        onChange={(e) => setThreshold(parseFloat(e.target.value))}
                        className="w-24 h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                      />
                      <span className="font-mono text-xs font-bold text-rose-400 w-10 text-right">
                        {Number(threshold).toFixed(2)}
                      </span>
                    </div>
                  </div>

                  {/* Progress Bar with Gate Marker */}
                  <div className="relative h-2.5 bg-slate-850 rounded-full overflow-hidden bg-slate-800/80">
                    {/* Dynamic Threshold Indicator Marker */}
                    <div 
                      className="absolute top-0 bottom-0 w-0.5 bg-rose-400 shadow-sm shadow-rose-400 z-10" 
                      style={{ left: `${Number(threshold) * 100}%` }}
                      title={`Relevance Gate Threshold tau = ${Number(threshold).toFixed(2)}`}
                    ></div>

                    {/* Similarity Fill */}
                    <div 
                      className={`h-full rounded-full transition-all duration-500 ${
                        !queryResult 
                          ? 'w-0' 
                          : queryResult.gated 
                          ? 'bg-gradient-to-r from-amber-500 to-rose-500' 
                          : 'bg-gradient-to-r from-cyan-500 to-emerald-400'
                      }`}
                      style={{ width: `${queryResult ? Math.min(100, Math.max(0, queryResult.s_max * 100)) : 0}%` }}
                    ></div>
                  </div>

                  <div className="flex justify-between text-[10px] font-mono text-slate-500">
                    <span>0.0 (Irrelevant)</span>
                    <span className="text-rose-400 font-semibold">&tau; = {Number(threshold).toFixed(2)} Gate Marker</span>
                    <span>1.0 (Identical)</span>
                  </div>
                </div>

                {/* Grounded Answer Card */}
                <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-5 min-h-[170px] flex flex-col justify-between gap-4">
                  <div>
                    <div className="flex items-center justify-between text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
                      <span>Verification & Answer Output</span>
                      {queryResult?.duration && (
                        <span className="font-mono text-[11px] text-slate-500 font-normal">
                          Retrieved & evaluated in {queryResult.duration}s
                        </span>
                      )}
                    </div>

                    {!queryResult ? (
                      <p className="text-sm text-slate-500 leading-relaxed">
                        Enter a question above. The system will retrieve vectors strictly bounded by your JWT tenant token, test candidate similarity against &tau; = {Number(threshold).toFixed(2)}, and formulate an answer with exact physical page citations.
                      </p>
                    ) : queryResult.gated ? (
                      <div className="flex flex-col gap-2">
                        <p className="text-amber-300 font-semibold text-base">
                          Information not found in source material.
                        </p>
                        <p className="text-xs text-slate-400 font-mono">
                          {queryResult.reason || `Maximum candidate cosine similarity (${queryResult.s_max}) failed relevance threshold (${queryResult.threshold}). Generative model call was suppressed to prevent hallucination.`}
                        </p>
                      </div>
                    ) : (
                      <div className="text-sm text-slate-200 leading-relaxed whitespace-pre-wrap">
                        {queryResult.answer}
                      </div>
                    )}
                  </div>

                  {/* Citation Badge */}
                  {queryResult && !queryResult.gated && queryResult.citation && (
                    <div className="inline-flex items-center gap-2 self-start bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 px-3 py-1.5 rounded-lg text-xs font-mono font-medium shadow-sm">
                      <CitationIcon className="w-4 h-4 text-cyan-400" />
                      <span>Citation: {queryResult.citation}</span>
                    </div>
                  )}
                </div>

                {/* Candidate Context Inspector Accordion */}
                {queryResult && queryResult.context_debug && (
                  <details className="group bg-slate-950/40 border border-slate-800 rounded-xl p-3 text-xs">
                    <summary className="font-medium text-slate-400 hover:text-slate-200 cursor-pointer flex items-center justify-between outline-none">
                      <span>Inspect Candidate Chunks & Delimiter Fences ({queryResult.context_debug.length} retrieved)</span>
                      <span className="text-slate-500 group-open:rotate-180 transition-transform">&#9662;</span>
                    </summary>
                    <div className="mt-3 flex flex-col gap-2 font-mono">
                      {queryResult.context_debug.map((chunk, idx) => (
                        <div key={idx} className="bg-slate-900/60 border-l-2 border-indigo-500 p-2.5 rounded-r-lg text-slate-300">
                          <div className="flex justify-between text-[11px] text-indigo-300 mb-1">
                            <span>Chunk #{chunk.chunk_idx} &bull; Page {chunk.source_page}</span>
                            <span className="text-cyan-300 font-bold">Sim: {chunk.score.toFixed(4)}</span>
                          </div>
                          <p className="text-[11px] text-slate-400 leading-relaxed">{chunk.preview}</p>
                        </div>
                      ))}
                    </div>
                  </details>
                )}

              </div>
            </div>

          </main>

          {/* Toast Notification Container */}
          <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-2">
            {toasts.map((t) => (
              <div 
                key={t.id} 
                className={`px-4 py-2.5 rounded-xl border text-xs font-medium shadow-2xl backdrop-blur-md transition-all ${
                  t.type === 'success' 
                    ? 'bg-slate-900/90 border-emerald-500/40 text-emerald-300' 
                    : t.type === 'error'
                    ? 'bg-slate-900/90 border-rose-500/40 text-rose-300'
                    : 'bg-slate-900/90 border-indigo-500/40 text-indigo-300'
                }`}
              >
                {t.msg}
              </div>
            ))}
          </div>

        </div>
      );
    }

    // Render the React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
